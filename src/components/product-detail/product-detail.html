<link rel="stylesheet" href="/components/product-detail/product-detail.css" data-component-style="product-detail" />

<div class="product-detail">

  <div class="product-detail__gallery">
    <div class="product-detail__main-image">
      <img src="/products/iphone13.webp" alt="iPhone 15 Pro" id="pd-main-img" />
    </div>
    <div class="product-detail__thumbs">
      <div class="product-detail__thumbs-viewport" id="pd-thumbs-viewport">
        <div class="product-detail__thumbs-container">
          <button class="product-detail__thumb product-detail__thumb--active" type="button" data-index="0">
            <img src="/products/iphone13.webp" alt="iPhone 15 Pro - Front" loading="lazy" />
          </button>
          <button class="product-detail__thumb" type="button" data-index="1">
            <img src="/products/iphone13.webp" alt="iPhone 15 Pro - Back" loading="lazy" />
          </button>
          <button class="product-detail__thumb" type="button" data-index="2">
            <img src="/products/iphone13.webp" alt="iPhone 15 Pro - Side" loading="lazy" />
          </button>
          <button class="product-detail__thumb" type="button" data-index="3">
            <img src="/products/iphone13.webp" alt="iPhone 15 Pro - Camera" loading="lazy" />
          </button>
          <button class="product-detail__thumb" type="button" data-index="4">
            <img src="/products/iphone13.webp" alt="iPhone 15 Pro - Display" loading="lazy" />
          </button>
          <button class="product-detail__thumb product-detail__thumb--more" type="button" data-index="5">
            <img src="/products/iphone13.webp" alt="iPhone 15 Pro - Angle" loading="lazy" />
            <span class="product-detail__thumb-overlay">+4 more</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="product-detail__info">

    <div class="product-detail__brand-row">
      <span class="product-detail__brand">Apple</span>
      <span class="product-detail__sku">SKU: APL-IP15P-256</span>
    </div>

    <h1 class="product-detail__title">iPhone 15 Pro</h1>

    <div class="product-detail__rating">
      <span class="product-detail__stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9734;</span>
      <span class="product-detail__reviews">42 reviews</span>
    </div>

    <p class="product-detail__price" id="pd-price">$999.00</p>

    <div class="product-detail__options">

      <div class="product-detail__option">
        <label class="product-detail__option-label" for="pd-storage">Storage</label>
        <select class="product-detail__select" id="pd-storage">
          <option value="" disabled selected>Select storage</option>
          <option value="128" data-price="999">128GB</option>
          <option value="256" data-price="1099">256GB (+$100)</option>
          <option value="512" data-price="1199">512GB (+$200)</option>
          <option value="1024" data-price="1399">1TB (+$400)</option>
        </select>
      </div>

      <div class="product-detail__option product-detail__option--hidden" id="pd-color-wrap">
        <label class="product-detail__option-label" for="pd-color">Color</label>
        <select class="product-detail__select" id="pd-color">
          <option value="" disabled selected>Select color</option>
          <option value="natural">Natural Titanium</option>
          <option value="blue">Blue Titanium</option>
          <option value="white">White Titanium</option>
          <option value="black">Black Titanium</option>
        </select>
      </div>

    </div>

    <div class="product-detail__addons">
      <p class="product-detail__addons-heading">Extra Products</p>

      <div class="product-detail__addon" data-addon-index="0" data-addon-price="49">
        <div class="product-detail__addon-thumb">
          <img src="/products/iphone13.webp" alt="MagSafe Case" loading="lazy" />
        </div>
        <div class="product-detail__addon-body">
          <div class="product-detail__addon-header">
            <span class="product-detail__addon-name">MagSafe Case</span>
            <span class="product-detail__addon-price">+$49</span>
          </div>
          <select class="product-detail__select product-detail__select--sm" data-addon-select>
            <option value="" disabled selected>Select color</option>
            <option value="black">Black</option>
            <option value="clear">Clear</option>
            <option value="blue">Blue</option>
          </select>
        </div>
      </div>

      <div class="product-detail__addon" data-addon-index="1" data-addon-price="29">
        <div class="product-detail__addon-thumb">
          <img src="/products/iphone13.webp" alt="Screen Protector" loading="lazy" />
        </div>
        <div class="product-detail__addon-body">
          <div class="product-detail__addon-header">
            <span class="product-detail__addon-name">Screen Protector</span>
            <span class="product-detail__addon-price">+$29</span>
          </div>
          <select class="product-detail__select product-detail__select--sm" data-addon-select>
            <option value="" disabled selected>Select type</option>
            <option value="glass">Tempered Glass</option>
            <option value="film">Film</option>
          </select>
        </div>
      </div>

      <div class="product-detail__addon" data-addon-index="2" data-addon-price="249">
        <div class="product-detail__addon-thumb">
          <img src="/products/iphone13.webp" alt="AirPods Pro 2nd Gen" loading="lazy" />
        </div>
        <div class="product-detail__addon-body">
          <div class="product-detail__addon-header">
            <span class="product-detail__addon-name">AirPods Pro 2nd Gen</span>
            <span class="product-detail__addon-price">+$249</span>
          </div>
          <button class="product-detail__addon-add" type="button" aria-label="Add item">
            <i class="ph ph-plus" aria-hidden="true"></i>
          </button>
        </div>
      </div>

    </div>

    <div class="product-detail__selected" id="pd-selected"></div>

    <div class="product-detail__total">
      <span class="product-detail__total-label">Total</span>
      <span class="product-detail__total-price" id="pd-total">$999.00</span>
    </div>

    <div class="product-detail__actions">
      <button class="product-detail__cart-btn" type="button">
        <i class="ph ph-shopping-cart" aria-hidden="true"></i>
        Add to cart
      </button>
      <button class="product-detail__wish-btn" type="button" aria-label="Add to wishlist">
        <i class="ph ph-heart" aria-hidden="true"></i>
      </button>
    </div>

    <p class="product-detail__delivery">
      <i class="ph ph-truck" aria-hidden="true"></i>
      Free delivery on orders over $30.0
    </p>

  </div>

</div>
