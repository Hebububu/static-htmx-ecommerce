<link rel="stylesheet" href="/components/product/card.css" data-component-style="product-card" />

<article class="product-card">
  <a class="product-card__media" href="/pages/product/detail.html" aria-label="View iPhone 13 details">
    <img
      class="product-card__image"
      src="/products/iphone13.webp"
      alt="iPhone 13 in starlight finish"
      loading="lazy"
      width="300"
      height="300"
    />
  </a>

  <div class="product-card__body">
    <div class="product-card__meta">
      <h3 class="product-card__title">iPhone 13</h3>
      <p class="product-card__rating" aria-label="Rated 4.9 out of 5 from 128 reviews">
        <span class="product-card__stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
        <span>(128)</span>
      </p>
    </div>

    <p class="product-card__description">
      Super Retina XDR display, dual-camera system, and the clean silhouette of Apple's classic design.
    </p>

    <div class="product-card__footer">
      <strong class="product-card__price">$799</strong>
      <button class="product-card__wish" type="button" aria-label="Add iPhone 13 to wishlist">
        <i class="ph ph-heart" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</article>
