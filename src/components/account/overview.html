<link rel="stylesheet" href="/components/account/overview.css" data-component-style="account-overview" />

<div class="account-overview">
  <div class="account-overview__card">
    <div class="account-overview__avatar">
      <i class="ph ph-user" aria-hidden="true"></i>
    </div>
    <div class="account-overview__info">
      <div class="account-overview__name-row">
        <h2 class="account-overview__name">John Doe</h2>
        <span class="account-overview__tier">Gold</span>
      </div>
      <p class="account-overview__meta">
        <span>john.doe@example.com</span>
        <span class="account-overview__meta-sep" aria-hidden="true">|</span>
        <span>Total Spent $749</span>
        <span class="account-overview__meta-sep" aria-hidden="true">|</span>
        <span>5 Orders</span>
      </p>
    </div>
  </div>

  <div class="account-overview__stats">
    <div class="account-overview__stat">
      <span class="account-overview__stat-label">Coupons</span>
      <span class="account-overview__stat-value">3</span>
    </div>
    <div class="account-overview__stat">
      <span class="account-overview__stat-label">Rewards</span>
      <span class="account-overview__stat-value">$1,250</span>
    </div>
    <div class="account-overview__stat">
      <span class="account-overview__stat-label">Wishlist</span>
      <span class="account-overview__stat-value">5</span>
    </div>
  </div>

  <div class="account-overview__orders">
    <div class="account-overview__orders-header">
      <h3 class="account-overview__orders-title">Recent 6 Months</h3>
      <p class="account-overview__orders-desc">Only confirmed orders are counted.</p>
      <p class="account-overview__orders-range">2025.09.11 - 2026.03.10</p>
    </div>

    <div class="account-overview__orders-body">
      <div class="account-overview__orders-summary">
        <p class="account-overview__orders-stat">Total Orders: <strong>12</strong></p>
        <p class="account-overview__orders-stat">Total Spent: <strong>$749</strong></p>
      </div>
      <div class="account-overview__orders-promo">
        <p class="account-overview__promo-text">
          Spend <strong class="account-overview__promo-highlight">$251 more</strong> to reach
          <strong class="account-overview__promo-tier">Platinum</strong>
        </p>
      </div>
    </div>

    <div class="account-overview__progress">
      <div class="account-overview__progress-labels">
        <span class="account-overview__progress-current">$749</span>
        <span class="account-overview__progress-sep">/</span>
        <span class="account-overview__progress-goal">$1,000</span>
      </div>
      <div class="account-overview__progress-track">
        <div class="account-overview__progress-fill" style="width: 74.9%"></div>
      </div>
    </div>
  </div>
</div>
