<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phones - E-commerce</title>

    <!-- Global styles -->
    <link rel="stylesheet" href="/css/global.css" />

    <!-- Phosphor Icons (regular weight) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" />

    <!-- htmx (self-hosted via /vendor/htmx.min.js) -->
    <script src="/vendor/htmx.min.js"></script>
  </head>
  <body>
    <!-- Header component -->
    <header
      hx-get="/components/layout/header.html"
      hx-trigger="load"
      hx-swap="innerHTML"
    ></header>

    <!-- Main content -->
    <main
      id="content"
      hx-get="/pages/product/list-content.html"
      hx-trigger="load"
      hx-swap="innerHTML"
    ></main>

    <!-- Footer component -->
    <footer
      hx-get="/components/layout/footer.html"
      hx-trigger="load"
      hx-swap="innerHTML"
    ></footer>

    <!-- Modal container -->
    <div id="modal-container"></div>

    <!-- Main app script -->
    <script type="module" src="/app.ts"></script>
  </body>
</html>
