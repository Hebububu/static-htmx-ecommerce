<link rel="stylesheet" href="/pages/home.css" data-component-style="home" />

<section class="home-banner-slot">
  <div
    class="container"
    hx-get="/components/banner/carousel.html"
    hx-trigger="load"
    hx-swap="innerHTML"
  ></div>
</section>

<section
  class="home-product-carousel container"
  data-reveal
  hx-get="/components/product/product-carousel.html"
  hx-trigger="load"
  hx-swap="innerHTML"
></section>

<section
  class="home-ranking container"
  hx-get="/components/product/ranking.html"
  hx-trigger="load"
  hx-swap="innerHTML"
></section>

<section class="home-showcase">
  <div class="container home-showcase__inner">
    <div class="home-showcase__copy" data-reveal="left">
      <p class="home-showcase__eyebrow">Featured product</p>
      <h1>Product card direction for the new catalog experience.</h1>
      <p>
        This demo keeps the layout focused on image, product info, price, and a wishlist action.
      </p>
    </div>

    <div
      class="home-showcase__card"
      data-reveal="right"
      hx-get="/components/product/card.html"
      hx-trigger="load"
      hx-swap="innerHTML"
    ></div>
  </div>
</section>
