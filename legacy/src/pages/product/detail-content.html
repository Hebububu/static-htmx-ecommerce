<link
	rel="stylesheet"
	href="/components/breadcrumb/breadcrumb.css"
	data-component-style="breadcrumb"
/>
<link
	rel="stylesheet"
	href="/pages/product/detail.css"
	data-component-style="product-detail-page"
/>

<section class="product-detail-page container" data-reveal>
	<nav class="breadcrumb" aria-label="Breadcrumb">
		<a class="breadcrumb__link" href="/">Home</a>
		<i class="ph ph-caret-right breadcrumb__separator" aria-hidden="true"></i>
		<a
			class="breadcrumb__link"
			href="/pages/product/list.html"
			hx-get="/pages/product/list-content.html"
			hx-target="#content"
			hx-swap="innerHTML"
			hx-push-url="/pages/product/list.html"
			>Phones</a
		>
		<i class="ph ph-caret-right breadcrumb__separator" aria-hidden="true"></i>
		<span class="breadcrumb__current" aria-current="page">iPhone 15 Pro</span>
	</nav>

	<div
		hx-get="/components/product-detail/product-detail.html"
		hx-trigger="load"
		hx-swap="innerHTML"
	></div>
</section>
