<link
	rel="stylesheet"
	href="/components/event-banner/event-banner.css"
	data-component-style="event-banner"
/>

<div class="event-banner">
	<div class="event-banner__image-wrap">
		<img
			class="event-banner__image"
			src="/banner/category/category-banner.webp"
			alt="Flash sale promotion"
			loading="eager"
		/>
	</div>
	<div class="event-banner__content">
		<span class="event-banner__eyebrow">LIMITED TIME</span>
		<h2 class="event-banner__heading">Flash Sale</h2>
		<p class="event-banner__desc">Up to 50% off selected devices. Don't miss out.</p>
		<div class="event-banner__countdown">
			<div class="event-banner__countdown-block">
				<span class="event-banner__countdown-num">47</span>
				<span class="event-banner__countdown-label">Hours</span>
			</div>
			<span class="event-banner__countdown-sep">:</span>
			<div class="event-banner__countdown-block">
				<span class="event-banner__countdown-num">59</span>
				<span class="event-banner__countdown-label">Min</span>
			</div>
			<span class="event-banner__countdown-sep">:</span>
			<div class="event-banner__countdown-block">
				<span class="event-banner__countdown-num">59</span>
				<span class="event-banner__countdown-label">Sec</span>
			</div>
		</div>
	</div>
</div>
