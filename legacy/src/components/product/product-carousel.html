<link rel="stylesheet" href="/components/product/card.css" data-component-style="product-card" />
<link
	rel="stylesheet"
	href="/components/product/product-carousel.css"
	data-component-style="product-carousel"
/>

<div class="product-carousel js-product-carousel">
	<div class="product-carousel__header">
		<h2 class="product-carousel__heading">New Arrivals</h2>
		<div class="product-carousel__nav">
			<button class="product-carousel__prev" type="button" aria-label="Previous product">
				<i class="ph ph-caret-left" aria-hidden="true"></i>
			</button>
			<button class="product-carousel__next" type="button" aria-label="Next product">
				<i class="ph ph-caret-right" aria-hidden="true"></i>
			</button>
		</div>
	</div>

	<div class="product-carousel__viewport">
		<div class="product-carousel__container">
			<div class="product-carousel__slide">
				<article class="product-card">
					<a class="product-card__media" href="#" aria-label="View iPhone 13 details">
						<img
							class="product-card__image"
							src="/products/iphone13.webp"
							alt="iPhone 13"
							loading="lazy"
						/>
					</a>
					<div class="product-card__body">
						<div class="product-card__meta">
							<h3 class="product-card__title">iPhone 13</h3>
							<p class="product-card__rating" aria-label="Rated 4.9 out of 5 from 128 reviews">
								<span class="product-card__stars" aria-hidden="true"
									>&#9733;&#9733;&#9733;&#9733;&#9733;</span
								>
								<span>(128)</span>
							</p>
						</div>
						<div class="product-card__footer">
							<strong class="product-card__price">$799</strong>
							<button
								class="product-card__wish"
								type="button"
								aria-label="Add iPhone 13 to wishlist"
							>
								<i class="ph ph-heart" aria-hidden="true"></i>
							</button>
						</div>
					</div>
				</article>
			</div>

			<div class="product-carousel__slide">
